# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      branch:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false
      DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY:
        required: false
      DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY_PASSWORD:
        required: false
      MACOS_CODESIGN_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CODESIGN_CERTIFICATE_PASSWORD:
        required: false
      MACOS_NOTARIZATION_APP_SPECIFIC_PASSWORD:
        required: false
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: false
      ANDROID_SIGNING_PASSWORD:
        required: false
      NETLIFY_BUILD_HOOK:
        required: false
      DASCHUER_AT_MIXXX_DOT_ORG_GPG_PRIVATE_KEY:
        required: false
      PPA_SSH_PRIVATE_KEY:
        required: false
      MIXXX_E2E_TOKEN:
        required: false

permissions:
  contents: read #  to fetch code (actions/checkout)
  pull-requests: write # To publish the E2E results
  actions: write # to delete outdated caches (gh cache delete)

jobs:
  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04
            os: ubuntu-26.04
            cmake_args: -DFFMPEG=ON -DLOCALECOMPARE=ON -DMAD=ON -DINSTALL_USER_UDEV_RULES=OFF
            ctest_args: ""
            compiler_cache: ccache
            compiler_cache_path: /home/runner/.cache/ccache
            compiler_cache_id: qt6
            cpack_generator: DEB
            buildenv_basepath: /home/runner/buildenv
            buildenv_script: tools/debian_buildenv.sh
            artifacts_name: Ubuntu 26.04 Qt6 DEB
            artifacts_path: build/*.deb
            artifacts_slug: ubuntu-jammy
            qml: ON
            tests: true
          - name: macOS 15 x64
            os: macos-15-intel
            cmake_args: -DCOREAUDIO=ON -DHSS1394=ON -DMACOS_BUNDLE=ON -DVCPKG_TARGET_TRIPLET=x64-osx-min1100-release
            ctest_args: "--exclude-regex DirectoryDAOTest.relocateDirectory"
            cpack_generator: DragNDrop
            compiler_cache: ccache
            compiler_cache_path: /Users/runner/Library/Caches/ccache
            compiler_cache_id: x64
            buildenv_basepath: /Users/runner/buildenv
            buildenv_script: tools/macos_release_buildenv.sh
            artifacts_name: macOS Intel DMG
            artifacts_path: build/*.dmg
            artifacts_slug: macos-macosintel
            qml: ON
            tests: true
          - name: macOS 15 arm64
            os: macos-15-intel
            cmake_args: -DCOREAUDIO=ON -DHSS1394=ON -DMACOS_BUNDLE=ON -DVCPKG_TARGET_TRIPLET=arm64-osx-min1100-release
            crosscompile: true
            cpack_generator: DragNDrop
            compiler_cache: ccache
            compiler_cache_path: /Users/runner/Library/Caches/ccache
            compiler_cache_id: arm64
            buildenv_basepath: /Users/runner/buildenv
            buildenv_script: tools/macos_arm64-cross-release_buildenv.sh
            artifacts_name: macOS ARM DMG
            artifacts_path: build/*.dmg
            artifacts_slug: macos-macosarm
            qml: ON
            tests: false
          - name: Windows Server 2025 VS2026 x64
            os: windows-2025-vs2026
            cmake_args: -DHSS1394=ON -DLOCALECOMPARE=ON -DMAD=ON -DMEDIAFOUNDATION=ON -DVCPKG_TARGET_TRIPLET=x64-windows-release
            cc: cl
            cxx: cl
            ctest_args: "--exclude-regex '^AutoDJProcessorTest.*$'"
            cpack_generator: WIX
            buildenv_basepath: C:\buildenv
            buildenv_script: tools/windows_release_buildenv.bat
            artifacts_name: Windows x64 Installer
            artifacts_path: build/*.msi
            artifacts_slug: windows-win64
            qml: ON
            arch: x64
            tests: true
          - name: Windows 11 VS2026 ARM64
            os: windows-11-vs2026-arm
            cmake_args: -DHSS1394=ON -DLOCALECOMPARE=ON -DMAD=ON -DMEDIAFOUNDATION=ON -DVCPKG_TARGET_TRIPLET=arm64-windows-release -DVCPKG_DEFAULT_HOST_TRIPLET=arm64-windows-release
            cc: cl
            cxx: cl
            ctest_args: "--exclude-regex '^AutoDJProcessorTest.*$'"
            cpack_generator: WIX
            buildenv_basepath: C:\buildenv
            buildenv_script: tools/windows_release_buildenv.bat
            artifacts_name: Windows ARM64 Installer
            artifacts_path: build/*.msi
            artifacts_slug: windows-winarm
            qml: ON
            arch: arm64
            tests: true
          - name: Android 15 arm64
            os: ubuntu-26.04
            cmake_args: >-
              -DHID=ON
              -DVCPKG_TARGET_TRIPLET=arm64-android
              -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release
              -DCMAKE_SYSTEM_NAME=Android
              -DBUILD_TESTING=OFF
              -DBUILD_BENCH=OFF
            buildenv_basepath: /home/runner/buildenv
            buildenv_script: tools/android_buildenv.sh
            artifacts_name: Android 15 APK
            artifacts_path: build/android-build/build/outputs/apk/release/*.apk
            artifacts_slug: android-15
            compiler_cache: ccache
            compiler_cache_path: /home/runner/.cache/ccache
            crosscompile: true
            arch: arm64
            qml: ON
            tests: false
          - name: AppImage Linux x86_64
            os: ubuntu-22.04
            cmake_args: >-
              -DMIXXX_APPIMAGE=ON
              -DINSTALL_USER_UDEV_RULES=OFF
              -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -DNDEBUG"
              -DCMAKE_INSTALL_PREFIX=/usr
              -DCMAKE_INSTALL_LIBDIR=lib
              -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined"
            ctest_args: ""
            cpack_generator: AppImage
            buildenv_basepath: /home/runner/buildenv
            buildenv_script: tools/appimage_release_buildenv.sh
            artifacts_name: AppImage Linux x86_64
            artifacts_path: build/*.AppImage
            artifacts_slug: linux-appimage
            arch: x86_64
            compiler_cache: ccache
            compiler_cache_path: /home/runner/.cache/ccache
            compiler_cache_id: appimage-qt6
            crosscompile: true
            qml: ON
            # FIXME: AppImage relies on xcb QPA which appears to suffers from compatibility issues with Spix, leading to too many false positives.
            tests: false
    uses: ./.github/workflows/platform.yml
    with:
      platform: ${{ toJSON(matrix) }}
      publish: ${{ inputs.publish }}
      branch: ${{ inputs.branch }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  e2e-comment:
    name: "Update E2E comment"
    if: always() && github.event_name == 'pull_request'
    needs: [platform, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Fetch base branch"
        continue-on-error: true
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"

      - name: "Bypass Azure APT cache"
        if: vars.BYPASS_AZURE_APT_MIRROR != null && runner.os == 'Linux'
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

      - name: "Install ffmpeg"
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: "Download results artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: mixxx-ui-test-*-e2e-*
          path: results

      - name: "Build and update E2E comment"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.MIXXX_E2E_TOKEN }}
          RESULTS_DIR: results
          # Recordings are not downloaded up front; the script lazily pulls
          # only the recordings referenced by the selected clips (VIDEO_DIR
          # is the download target/reuse cache).
          VIDEO_DIR: videos
          SNIPPET_DIR: snippets
          BASE_REF: FETCH_HEAD
          E2E_LOG_LEVEL: debug
        run: python3 tools/generate_gh_e2e_comment.py

  flatpak:
    name: "Flatpak"
    uses: ./.github/workflows/flatpak-build.yml
    with:
      publish: ${{ inputs.publish }}
      branch: ${{ inputs.branch }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  update_manifest:
    name: "Update manifest file on download server"
    runs-on: ubuntu-latest
    needs: platform
    # Always run this job, even if one or more jobs from the `platform` jobs
    # fail to allow partial updates of the manifest.
    # Don't run it on forks that do not have access to our external
    # infrastructure, though.
    if: always() && github.repository == 'mixxxdj/mixxx'
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        # Works around an issue where not the latest tag is not fetched when the
        # workflow is triggered by a tag push event.
        # Possibly related: actions/checkout#290
        run: git fetch origin --force --tags

      - name: "Collect Artifacts Metadata & Write Manifest"
        # Retrieve the metadata from the platform jobs' outputs, merge them into a
        # single JSON document and then deploy to the server.
        if: inputs.publish && env.SSH_PASSWORD != null
        run: >
          if [[ "${{ inputs.ref }}" =~ ^refs/tags/.* ]];
          then
            export DEPLOY_PATH='releases/{git_describe}/manifest.json';
          else
            export DEPLOY_PATH='snapshots/{git_branch}/manifest.json';
          fi;
          python3 tools/deploy.py generate-manifest
          --update
          --output-dir 'deploy/'
          --dest-path "${DEPLOY_PATH}"
          --dest-url 'https://downloads.mixxx.org'
        env:
          JOB_DATA: ${{ toJSON(needs.platform) }}
          SSH_PASSWORD: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY_PASSWORD }}

      - name: "Set up SSH Agent"
        if: inputs.publish && env.SSH_PRIVATE_KEY != null  && env.MANIFEST_DIRTY != null && env.MANIFEST_DIRTY != '0'
        shell: bash
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}
          SSH_HOST: downloads-hostgator.mixxx.org
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${SSH_PRIVATE_KEY}"
          mkdir -p "${HOME}/.ssh"
          ssh-keyscan "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      - name: "Deploy Manifest"
        if: inputs.publish && env.SSH_AUTH_SOCK != null
        shell: bash
        run: rsync --verbose --recursive --checksum --times --delay-updates "deploy/" "${SSH_USER}@${SSH_HOST}:${DESTDIR}/"
        env:
          DESTDIR: public_html/downloads
          SSH_HOST: downloads-hostgator.mixxx.org
          SSH_USER: mixxx

      - name: "Trigger Netlify build"
        if: env.NETLIFY_BUILD_HOOK != null && env.MANIFEST_DIRTY != null && env.MANIFEST_DIRTY != '0'
        run: curl -X POST -d '{}' ${{ env.NETLIFY_BUILD_HOOK }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
