# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Platform build & tests

# Per-platform fuse: called once per matrix entry by build.yml. The build job
# compiles Mixxx and uploads the build directory as an artifact; the tests
# job runs the static test matrix (unit + three E2E batches) for THIS
# platform only, so each platform's tests start as soon as its own build is
# done instead of waiting for the other platforms to finish theirs.
#
# All platform metadata arrives serialised in the `platform` input (the JSON
# of one entry of build.yml's static matrix), so the platform definitions
# have a single source of truth there.

on:
  workflow_call:
    inputs:
      platform:
        description: "Serialised platform entry (JSON) from build.yml's matrix"
        type: string
        required: true
      publish:
        type: boolean
        default: false
      branch:
        type: string
        required: true
      ref:
        type: string
        required: true
    outputs:
      artifact-macos-macosintel:
        value: ${{ jobs.build.outputs.artifact-macos-macosintel }}
      artifact-macos-macosarm:
        value: ${{ jobs.build.outputs.artifact-macos-macosarm }}
      artifact-windows-win64:
        value: ${{ jobs.build.outputs.artifact-windows-win64 }}
      artifact-windows-winarm:
        value: ${{ jobs.build.outputs.artifact-windows-winarm }}

permissions:
  contents: read #  to fetch code (actions/checkout)
  actions: write # to delete outdated caches (gh cache delete)

jobs:
  build:
    name: ${{ fromJSON(inputs.platform).name }}
    runs-on: ${{ fromJSON(inputs.platform).os }}
    container: ${{ fromJSON(inputs.platform).container }}
    outputs:
      artifact-macos-macosintel: ${{ steps.prepare_deploy.outputs.artifact-macos-macosintel }}
      artifact-macos-macosarm: ${{ steps.prepare_deploy.outputs.artifact-macos-macosarm }}
      artifact-windows-win64: ${{ steps.prepare_deploy.outputs.artifact-windows-win64 }}
      artifact-windows-winarm: ${{ steps.prepare_deploy.outputs.artifact-windows-winarm }}

    env:
      # macOS codesigning
      MACOS_CODESIGN_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12_BASE64 }}
      MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
      # Android signing
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          # This is necessary for making `git describe` work.
          fetch-depth: 0

      - name: "[Arch Linux] Workaround for the 'unsafe repository' issue caused by CVE-2022-24765"
        if: fromJSON(inputs.platform).container != null
        # See https://github.com/actions/checkout/issues/760 for details
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: "Ensure that all tags are fetched"
        # Works around an issue where not the latest tag is not fetched when the
        # workflow is triggered by a tag push event.
        # Possibly related: actions/checkout#290
        run: git fetch origin --force --tags

      - name: "[macOS] Set up cmake"
        uses: jwlawson/actions-setup-cmake@v2.2
        # Ubuntu 26.04 should use the CMake version from the repos.
        if: runner.os == 'macOS'
        with:
          # This should always match the minimum required version in
          # our CMakeLists.txt
          cmake-version: "3.22.x"

      - name: "[Windows] Set up cmake"
        uses: jwlawson/actions-setup-cmake@v2.2
        # Ubuntu 26.04 should use the CMake version from the repos.
        # On Windows ARM64 this action installs the x64 version which has unwanted side effects
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        with:
          # This version of CMake is needed for Wix Toolset >= v4 support,
          # see: https://cmake.org/cmake/help/latest/cpack_gen/wix.html#variable:CPACK_WIX_VERSION
          cmake-version: "3.30.x"

      - name: "[Windows] Set up MSVC Developer Command Prompt"
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ fromJSON(inputs.platform).arch }}

      - name: "[Windows 11 ARM64] Install ARM64 CMake"
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-arm64.zip -OutFile cmake-arm64.zip
          Expand-Archive cmake-arm64.zip -DestinationPath $env:USERPROFILE\cmake
          $cmakePath = "$env:USERPROFILE\cmake\cmake-3.30.1-windows-arm64\bin"
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$cmakePath"

      - name: "[macOS] install ccache and make"
        if: runner.os == 'macOS'
        run: |
          brew install ccache

      - name: "[macOS/Windows] Get build environment name"
        if: runner.os != 'Linux'
        run: ${{ fromJSON(inputs.platform).buildenv_script }} name

      - name: "[macOS] Import Apple code signing identity"
        id: apple_codesign
        if: runner.os == 'macOS' && env.MACOS_CODESIGN_CERTIFICATE_P12_BASE64 != null && env.MACOS_CODESIGN_CERTIFICATE_PASSWORD != null
        run: |
          # Decode the certificate
          echo "${{ env.MACOS_CODESIGN_CERTIFICATE_P12_BASE64 }}" | base64 -d -o ~/certificate.p12

          # Create a temporary keychain for the certificate and import it.
          security create-keychain -p mixxx Mixxx.keychain
          security unlock-keychain -p mixxx Mixxx.keychain
          security import ~/certificate.p12 -k Mixxx.keychain \
            -P "${MACOS_CODESIGN_CERTIFICATE_PASSWORD}" -A
          security find-certificate -a -Z Mixxx.keychain
          APPLE_CODESIGN_IDENTITY="$(security find-certificate -a -Z Mixxx.keychain | grep ^SHA-1 | cut -d " " -f3 | uniq)"
          security set-key-partition-list -S "apple-tool:,apple:" -k mixxx Mixxx.keychain
          # Add keychain to search list
          security list-keychains -s Mixxx.keychain
          # Prevent keychain access from timing out
          security set-keychain-settings Mixxx.keychain
          echo "CMAKE_ARGS_EXTRA=${CMAKE_ARGS_EXTRA} -DAPPLE_CODESIGN_IDENTITY=${APPLE_CODESIGN_IDENTITY}" >> "${GITHUB_ENV}"
          echo "APPLE_CODESIGN_IDENTITY=${APPLE_CODESIGN_IDENTITY}" >> $GITHUB_ENV

      - name: "[android] Setup signing key"
        if: startsWith(fromJSON(inputs.platform).artifacts_slug, 'android')
        run: |
          if [ -z "${ANDROID_SIGNING_KEYSTORE_BASE64}" ]; then
            # If no signing key is available (e.g running on a fork), generate a temporary key
            keytool \
              -genkey \
              -keystore mixxx.keystore \
              -alias mixxx \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -keypass mixxxandroid \
              -storepass mixxxandroid \
              -dname "CN=${{ github.actor }}"
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=mixxxandroid" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=mixxxandroid" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_PATH=${{ github.workspace }}/mixxx.keystore" >> $GITHUB_ENV
          else
            echo "${{ env.ANDROID_SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/mixxx.keystore
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=${{ env.ANDROID_SIGNING_PASSWORD }}" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=${{ env.ANDROID_SIGNING_PASSWORD }}" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_PATH=${{ github.workspace }}/mixxx.keystore" >> $GITHUB_ENV
          fi

      - name: "[AppImage] Set up cmake"
        # The CPack AppImage generator requires CMake >= 4.2, which is not
        # available from apt on the ubuntu-22.04 runner (kept for the glibc
        # baseline).  Use the same action as the macOS/Windows builds.
        if: startsWith(fromJSON(inputs.platform).buildenv_script, 'tools/appimage_')
        uses: jwlawson/actions-setup-cmake@v2.2
        with:
          cmake-version: "4.2.x"

      - name: "[Linux] Bypass Azure APT cache"
        if: vars.BYPASS_AZURE_APT_MIRROR != null && runner.os == 'Linux'
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

      - name: "[macOS/Linux] Set up build environment"
        if: fromJSON(inputs.platform).buildenv_script != null && runner.os != 'Windows'
        run: ${{ fromJSON(inputs.platform).buildenv_script }} setup
        env:
          BUILDENV_BASEPATH: ${{ fromJSON(inputs.platform).buildenv_basepath }}

      - name: "[Windows] Set up build environment"
        if: fromJSON(inputs.platform).buildenv_script != null && runner.os == 'Windows'
        # With the cmd shell the ERRORLEVEL is checked
        shell: cmd
        run: ${{ fromJSON(inputs.platform).buildenv_script }} setup
        env:
          BUILDENV_BASEPATH: ${{ fromJSON(inputs.platform).buildenv_basepath }}

      - name: "[VCPKG] Restore buildenv archive cache"
        id: buildenv_cache
        if: env.BUILDENV_NAME != null
        uses: actions/cache/restore@v6
        with:
          path: ${{ fromJSON(inputs.platform).buildenv_basepath }}/${{ env.BUILDENV_NAME }}.zip
          key: buildenv-${{ env.BUILDENV_NAME }}

      - name: "[Ubuntu/macOS] Restore ccache cache"
        # Caches are only saved by push builds (see "Save ccache cache").
        # Pull requests can read caches of their base branch, but caches they
        # save are only visible to themselves and evict the base branch caches
        # from the 10 GB repository quota.
        id: ccache_cache
        if: runner.os != 'windows'
        uses: actions/cache/restore@v6
        with:
          path: ${{ fromJSON(inputs.platform).compiler_cache_path }}
          # Key by source state (not run number) so runs that only change the
          # workflow — or repeat the same source — reuse the compiled objects
          # instead of creating a fresh cache entry every time.
          key: ${{ fromJSON(inputs.platform).os }}-${{ fromJSON(inputs.platform).compiler_cache_id }}-${{ inputs.branch }}-${{ env.BUILDENV_NAME || 'system' }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ fromJSON(inputs.platform).os }}-${{ fromJSON(inputs.platform).compiler_cache_id }}-${{ inputs.branch }}
            ${{ fromJSON(inputs.platform).os }}-${{ fromJSON(inputs.platform).compiler_cache_id }}-${{ github.base_ref }}
            ${{ fromJSON(inputs.platform).os }}-${{ fromJSON(inputs.platform).compiler_cache_id }}

      - name: "[Ubuntu/macOS] Set up ccache"
        # The limit applies to the compressed size. Uncompressed, the Ubuntu
        # build with debug info exceeds 2G and evicts its own objects.
        run: |
          ${{ fromJSON(inputs.platform).compiler_cache }} --zero-stats
          ${{ fromJSON(inputs.platform).compiler_cache }} --max-size=2G
        if: runner.os != 'windows'

      # Remove unused pre-installed software as the runner runs out of space otherwise
      # Currently freeing up about 17.7G, ~20%
      - name: "[android] Free up disk space"
        if: startsWith(fromJSON(inputs.platform).artifacts_slug, 'android')
        run: |
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer                 # Free up 677M
          sudo rm -rf /opt/az                      # Free up 649M
          sudo rm -rf /opt/google                  # Free up 378M
          sudo rm -rf /opt/hostedtoolcache/CodeQL  # Free up 1.6G
          sudo rm -rf /opt/hostedtoolcache/go      # Free up 808M
          sudo rm -rf /opt/hostedtoolcache/node    # Free up 532M
          sudo rm -rf /opt/hostedtoolcache/PyPy    # Free up 520M
          sudo rm -rf /opt/hostedtoolcache/Python  # Free up 1.5G
          sudo rm -rf /opt/microsoft               # Free up 781M
          sudo rm -rf /opt/pipx                    # Free up 499M
          sudo rm -rf /usr/lib/google-cloud-sdk    # Free up 957M
          sudo rm -rf /usr/local/julia1.11.7       # Free up 996M
          sudo rm -rf /usr/local/share/powershell  # Free up 1.3G
          sudo rm -rf /usr/share/dotnet            # Free up 3.4G
          sudo rm -rf /usr/share/swift             # Free up 3.2G
          sudo rm -rf /usr/local/share/vcpkg       # Size unknown, but obvious duplicate

      - name: "Create build directory"
        run: mkdir build

      - name: "Configure"
        run: >-
          cmake ${{ fromJSON(inputs.platform).cmake_args }} ${{ env.CMAKE_ARGS_EXTRA }}
          -DBATTERY=ON
          -DBROADCAST=ON
          -DBULK=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DWARNINGS_FATAL=ON
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          -DCMAKE_VERBOSE_MAKEFILE=OFF
          -DDEBUG_ASSERTIONS_FATAL=OFF
          -DDOWNLOAD_MANUAL=ON
          -DHID=ON
          -DKEYFINDER=ON
          -DLILV=ON
          -DMODPLUG=ON
          -DOPUS=ON
          -DQML=${{ fromJSON(inputs.platform).qml || 'OFF' }}
          -DQT6=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
          -DWAVPACK=ON
          -L
          ..
        working-directory: build
        env:
          CC: ${{ fromJSON(inputs.platform).cc }}
          CXX: ${{ fromJSON(inputs.platform).cxx }}

      - name: "[VCPKG] Save buildenv archive cache"
        id: buildenv_save
        if: steps.buildenv_cache.outputs.cache-hit != 'true' && env.BUILDENV_NAME != null
        uses: actions/cache/save@v6
        with:
          path: ${{ fromJSON(inputs.platform).buildenv_basepath }}/${{ env.BUILDENV_NAME }}.zip
          key: buildenv-${{ env.BUILDENV_NAME }}

      - name: "[Ubuntu/macOS] Set up gcc/clang problem matcher"
        if: runner.os != 'Windows'
        uses: ammaraskar/gcc-problem-matcher@0.3.0

      - name: "[Windows] Set up MSVC problem matcher"
        if: runner.os == 'Windows'
        uses: ammaraskar/msvc-problem-matcher@0.3.0

      - name: "Build"
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        run: cmake --build . --config RelWithDebInfo -j ${{ runner.os == 'macOS' && '3' || '4' }}
        working-directory: build
        env:
          CC: ${{ fromJSON(inputs.platform).cc }}
          CXX: ${{ fromJSON(inputs.platform).cxx }}

      - name: "[Ubuntu/macOS] Print compiler cache stats"
        if: runner.os != 'windows'
        run: |
          ${{ fromJSON(inputs.platform).compiler_cache }} --show-stats
          ${{ fromJSON(inputs.platform).compiler_cache }} --cleanup

      - name: "[Ubuntu/macOS] Save ccache cache"
        id: ccache_save
        if: runner.os != 'windows' && steps.ccache_cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/cache/save@v6
        with:
          path: ${{ fromJSON(inputs.platform).compiler_cache_path }}
          key: ${{ steps.ccache_cache.outputs.cache-primary-key }}

      - name: "[Ubuntu/macOS] Delete outdated ccache caches"
        # Every source change creates a new cache entry for this branch. Drop
        # the older ones so they don't evict the caches of other branches.
        if: steps.ccache_save.outcome == 'success'
        run: |
          # A build of a newer commit may have saved its cache already
          if [ "$(gh api "repos/$GH_REPO/commits/$GITHUB_REF" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF has newer commits, not deleting any caches"
            exit 0
          fi
          gh cache list --ref "$GITHUB_REF" --key "$KEY_PREFIX" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY\") | .id" |
          while read -r id; do
            gh cache delete "$id"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.ccache_cache.outputs.cache-primary-key }}
          # Also matches caches made with an outdated build environment
          KEY_PREFIX: ${{ fromJSON(inputs.platform).os }}-${{ fromJSON(inputs.platform).compiler_cache_id }}-${{ inputs.branch }}-

      - uses: actions/upload-artifact@v7
        # The build directory is the runtime the tests jobs below (and the
        # E2E batches) reuse; only testable platforms need it.
        if: fromJSON(inputs.platform).tests == true
        with:
          name: mixxx-build-${{ fromJSON(inputs.platform).artifacts_slug }}
          path: build
          retention-days: 1

      - name: "[Windows] Sign executables"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: mixxx
          certificate-profile-name: mixxx
          files-folder: build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 600
          # The x64 and ARM64 runners share the cache keys, but their workspaces
          # are on different drives (D: vs C:), so a cache saved by ARM64
          # restores the module to the wrong drive on x64 and signing fails.
          # https://github.com/Azure/artifact-signing-action/issues/146
          cache-dependencies: false

      - name: "[Windows] Sign WiX custom action DLL"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: mixxx
          certificate-profile-name: mixxx
          files: ${{ github.workspace }}/build/packaging/wix/mixxxupgradecustomaction.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 600
          # See "Sign executables"
          cache-dependencies: false

      - name: "[Windows] Install WiX Toolset"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet.exe tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2

      - name: "Package"
        id: package
        if: fromJSON(inputs.platform).cpack_generator != null
        # Use retry loop to work around a race condition on macOS causing
        # 'Resource busy' errors with 'hdiutil'. See
        # https://github.com/actions/runner-images/issues/7522
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: ${{ runner.os == 'macOS' && 12 || 1 }}
          retry_wait_seconds: 1
          command: |
            cd build
            cpack -G ${{ fromJSON(inputs.platform).cpack_generator }} -V

      - name: "[AppImage] Upload AppImage"
        if: fromJSON(inputs.platform).cpack_generator == 'AppImage'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ fromJSON(inputs.platform).artifacts_path }}
          if-no-files-found: error
          # Match the other artifacts and upload uncompressed.  With
          # archive=false the AppImage is uploaded as-is and the artifact
          # name becomes the file name (the AppImage already is compressed,
          # so re-zipping it is wasted work).
          archive: "false"

      - name: "[AppImage] Smoke test"
        # Run the packaged AppImage once.  This catches loader-level failures
        # (e.g. the ld.so assertion a broken linker produces, or missing
        # bundled libraries) that a build-only pipeline cannot see.  The
        # runner has no display, so --version may exit non-zero after
        # initializing Qt — reaching Mixxx startup is what matters.
        if: fromJSON(inputs.platform).cpack_generator == 'AppImage'
        run: |
          # The AppImage does not bundle libpipewire (it is excluded), so the
          # host must provide it; the bare runner image lacks it.
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-0
          APPIMAGE=$(ls build/*.AppImage | head -1)
          echo "Smoke-testing ${APPIMAGE}"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 "${APPIMAGE}" --version >/tmp/smoke.log 2>&1
          rc=$?
          set -e
          if grep -qE "Inconsistency detected by ld.so|error while loading shared libraries|cannot open shared object file" /tmp/smoke.log; then
            echo "FAIL: AppImage failed at loader level (rc=${rc})"
            cat /tmp/smoke.log
            exit 1
          fi
          if ! grep -qE "Mixxx [0-9]|Using preferences|Selected Qt style|ConfigObject:" /tmp/smoke.log; then
            echo "FAIL: AppImage did not reach Mixxx startup (rc=${rc})"
            cat /tmp/smoke.log
            exit 1
          fi
          echo "SMOKE OK"

      - name: Upload failed packaging logs
        if: always() && steps.package.outcome == 'failure' && runner.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(inputs.platform).os }}-logs-packages-wix
          path: ${{ github.workspace }}/build/_CPack_Packages/win64/WIX/wix.log

      - name: "[Ubuntu] Import DEB package maintainer GPG key"
        if: fromJSON(inputs.platform).name == 'Ubuntu 26.04' && env.GPG_PRIVATE_KEY != null
        env:
          GPG_PRIVATE_KEY: ${{ secrets.DASCHUER_AT_MIXXX_DOT_ORG_GPG_PRIVATE_KEY }}
        run: gpg --import <(echo "$GPG_PRIVATE_KEY")

      - name: "[Ubuntu] Set up for Launchpad PPA SSH upload"
        if: fromJSON(inputs.platform).name == 'Ubuntu 26.04' && env.PPA_SSH_KEY != null
        env:
          PPA_SSH_KEY: ${{ secrets.PPA_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$PPA_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "# ppa.launchpad.net:22 SSH-2.0-Twisted_20.3.0+lp11" >> ~/.ssh/known_hosts
          echo "|1|vctA7tDErFfMmg90fV0D4We8BB8=|DuVjz6Bom2lTeHQT8CxbXMZh2U0= ssh-rsa " >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          sudo tee /etc/dput.cf > /dev/null <<'EOF'
          [ssh-ppa]
          fqdn            = ppa.launchpad.net
          method          = sftp
          incoming        = ~%(ssh-ppa)s
          login           = daschuer
          EOF
          sudo chmod 644 /etc/dput.cf

      - name: "Package for PPA"
        # No need to do the PPA build for both Ubuntu versions
        if: fromJSON(inputs.platform).name == 'Ubuntu 26.04'
        run: |
          if [[ "${{ inputs.ref }}" == "refs/heads/main" ]] && [[ "${{ github.repository }}" == "mixxxdj/mixxx" ]]; then
            CPACK_ARGS="-D DEB_UPLOAD_PPA=ssh-ppa:mixxx/nightlies"
          elif [[ "${{ inputs.ref }}" == "refs/heads/2.6" ]] && [[ "${{ github.repository }}" == "mixxxdj/mixxx" ]]; then
            CPACK_ARGS="-D DEB_UPLOAD_PPA=ssh-ppa:mixxx/mixxxbetas"
          elif [[ "${{ inputs.ref }}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${{ github.repository }}" == "mixxxdj/mixxx" ]]; then
            CPACK_ARGS="-D DEB_UPLOAD_PPA=ssh-ppa:mixxx/mixxx"
          elif [[ "${{ inputs.ref }}" == "refs/heads/2.5" ]] && [[ "${{ github.repository }}" == "mixxxdj/mixxx" ]]; then
            CPACK_ARGS="-D DEB_UPLOAD_PPA=ssh-ppa:mixxx/mixxxpatches"
          else
            # only build the source DEB, do not upload
            CPACK_ARGS="-D DEB_SOURCEPKG=ON"
          fi
          cpack -G External $CPACK_ARGS
        working-directory: build

      - name: "[macOS] Sign, Notarize, and Staple Package"
        if: runner.os == 'macOS' && env.MACOS_CODESIGN_CERTIFICATE_P12_BASE64 != null && env.MACOS_CODESIGN_CERTIFICATE_PASSWORD != null && env.APPLE_APP_SPECIFIC_PASSWORD != null
        run: packaging/macos/sign_notarize_staple.sh build/*.dmg
        env:
          APPLE_ID_USERNAME: daschuer@mixxx.org
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: JBLRSP95FC

      - name: "[Windows] Sign installer"
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: mixxx
          certificate-profile-name: mixxx
          files-folder: build
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          timeout: 600
          # See "Sign executables"
          cache-dependencies: false

      - name: "Prepare for deployment"
        # Copy the desired directory structure to the deploy/ directory. This
        # also generates metadata for file artifact and write it to the job
        # output using the artifacts_slug value.
        # The AppImage publishes via appimage.yml, not via the generic path.
        id: prepare_deploy
        if: inputs.publish && fromJSON(inputs.platform).artifacts_path != null && fromJSON(inputs.platform).cpack_generator != 'AppImage'
        shell: bash
        run: >
          if [[ "${{ inputs.ref }}" =~ ^refs/tags/.* ]];
          then
            export DEPLOY_PATH='releases/{git_describe}/mixxx-{git_describe}-{package_slug}{ext}';
          else
            export DEPLOY_PATH='snapshots/{git_branch}/mixxx-{git_describe}-{package_slug}{ext}';
          fi;
          python3 tools/deploy.py prepare-deployment
          --slug '${{ fromJSON(inputs.platform).artifacts_slug }}'
          --output-dir 'deploy/'
          --dest-path "${DEPLOY_PATH}"
          --dest-url 'https://downloads.mixxx.org'
          ${{ fromJSON(inputs.platform).artifacts_path }}

      # TODO create a F-droid repo?
      # - name: fdroid nightly
      #   run: |
      #     sudo add-apt-repository ppa:fdroid/fdroidserver
      #     sudo apt-get update
      #     sudo apt-get install apksigner fdroidserver --no-install-recommends
      #     export DEBUG_KEYSTORE=$
      #     fdroid nightly --archive-older 10

      # Warning: do not move this step before restoring caches or it will break caching due to
      # https://github.com/actions/cache/issues/531
      - name: "[Windows] Install rsync and openssh"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}
        if: runner.os == 'Windows' && inputs.publish && env.SSH_PRIVATE_KEY != null
        run: |
          if (Test-Path "C:\msys64\usr\bin") {
            $msysPath="C:\msys64"
          } else {
            choco install msys2 -y
            $msysPath="C:\tools\msys64"
          }
          $Env:PATH="$msysPath\usr\bin;$Env:PATH"
          pacman -S --noconfirm coreutils bash rsync openssh
          # Unfortunately, mixing executables from msys64 and mingw (i.e. Git
          # Bash) does not work properly and leads to errors like these:
          #
          #     0 [main] python3 (5248) C:\msys64\usr\bin\python3.exe: *** fatal error - cygheap base mismatch detected - 0x180347408/0x180352408.
          #
          # Even when prepending the MSYS2 binary directory to %PATH%, GitHub
          # Actions will still pick the Git Bash executable over the MSYS2 one
          # when using `shell: bash`. Since it's not feasible to set `shell` to
          # an absolute path in a cross-platform build workflow, we overwrite the
          # git bash executable with the MSYS2 one.
          #
          # Also see related issue:
          # https://github.com/actions/virtual-environments/issues/594
          Copy-Item -Path "$msysPath\usr\bin\bash.exe" -Destination "C:\Program Files\Git\bin\bash.exe" -Force
          # By default, MSYS2 uses an
          # /etc/profile file that changes
          # the current working directory
          # when bash is started. We don't
          # want this behavior,so we just
          # delete it.
          Remove-Item -Path "$msysPath\etc\profile"
          # Add MSYS2's tools to %PATH%.
          Add-Content -Path "$Env:GITHUB_ENV" -Value "PATH=$Env:PATH"

      - name: "Set up SSH Agent"
        if: inputs.publish && env.SSH_PRIVATE_KEY != null
        shell: bash
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_HOSTGATOR_DOT_MIXXX_DOT_ORG_KEY }}
          SSH_HOST: downloads-hostgator.mixxx.org
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${SSH_PRIVATE_KEY}"
          mkdir -p "${HOME}/.ssh"
          ssh-keyscan "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"

      - name: "[Android/macOS/Windows] Upload build to downloads.mixxx.org"
        # Skip deploying Ubuntu builds to downloads.mixxx.org (these are
        # deployed to the PPA) and the AppImage (published via appimage.yml).
        if: fromJSON(inputs.platform).cpack_generator != 'AppImage' && startsWith(fromJSON(inputs.platform).artifacts_slug, 'ubuntu') != true && inputs.publish && env.SSH_AUTH_SOCK != null
        shell: bash --login -eo pipefail "{0}"
        run: rsync --verbose --recursive --checksum --times --delay-updates "deploy/" "${SSH_USER}@${SSH_HOST}:${DESTDIR}/"
        env:
          DESTDIR: public_html/downloads
          SSH_HOST: downloads-hostgator.mixxx.org
          SSH_USER: mixxx

      # Workaround for https://github.com/actions/cache/issues/531
      - name: Use system tar & zstd from Chocolatey for caching
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:/Windows/System32;C:/ProgramData/Chocolatey/bin" >> $GITHUB_PATH

      - name: "Upload GitHub Actions artifacts"
        # The AppImage is uploaded by the dedicated "[AppImage] Upload AppImage"
        # step with a stable name used by the publish workflow.
        if: fromJSON(inputs.platform).artifacts_path != null && fromJSON(inputs.platform).cpack_generator != 'AppImage'
        uses: actions/upload-artifact@v7.0.1
        with:
          archive: "false"
          path: ${{ fromJSON(inputs.platform).artifacts_path }}

  tests:
    name: Test ${{ matrix.target }} (${{ fromJSON(inputs.platform).name }})
    needs: build
    if: fromJSON(inputs.platform).tests == true
    strategy:
      fail-fast: false
      matrix:
        # Static test matrix: one unit entry plus three E2E batches of
        # ~90 runtime scenarios each (batch composition targets the
        # post-re-slice feature layout; see docs/e2e-matrix-reorg-kickoff.md).
        # A future `test-matrix` input can dynamise this.
        include:
          - target: unit
          - target: e2e-batch-1
            features: "browse"
          - target: e2e-batch-2
            features: "deck|waveform"
          - target: e2e-batch-3
            features: "preferences|sound|analyzer|broadcast|recording"
    runs-on: ${{ fromJSON(inputs.platform).os }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Download build artifacts"
        uses: actions/download-artifact@v8
        with:
          name: mixxx-build-${{ fromJSON(inputs.platform).artifacts_slug }}
          path: build

      - name: "Fix artifact permissions"
        if: runner.os != 'Windows'
        run: chmod +x build/mixxx-test

      - name: "[macOS] Set up cmake"
        uses: jwlawson/actions-setup-cmake@v2.2
        if: runner.os == 'macOS'
        with:
          cmake-version: "3.22.x"

      - name: "[Windows] Set up cmake"
        uses: jwlawson/actions-setup-cmake@v2.2
        if: runner.os == 'Windows' && runner.arch != 'ARM64'
        with:
          cmake-version: "3.30.x"

      - name: "[Windows] Set up MSVC Developer Command Prompt"
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ fromJSON(inputs.platform).arch }}

      - name: "[Windows 11 ARM64] Install ARM64 CMake"
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-arm64.zip -OutFile cmake-arm64.zip
          Expand-Archive cmake-arm64.zip -DestinationPath $env:USERPROFILE\cmake
          $cmakePath = "$env:USERPROFILE\cmake\cmake-3.30.1-windows-arm64\bin"
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$cmakePath"
          cmake --version

      - name: "[Linux] Bypass Azure APT cache"
        if: vars.BYPASS_AZURE_APT_MIRROR != null && runner.os == 'Linux'
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt

      - name: "[macOS/Linux] Set up build environment"
        if: fromJSON(inputs.platform).buildenv_script != null && runner.os != 'Windows'
        run: ${{ fromJSON(inputs.platform).buildenv_script }} setup
        env:
          BUILDENV_BASEPATH: ${{ fromJSON(inputs.platform).buildenv_basepath }}

      - name: "[Windows] Set up build environment"
        if: fromJSON(inputs.platform).buildenv_script != null && runner.os == 'Windows'
        # With the cmd shell the ERRORLEVEL is checked
        shell: cmd
        run: ${{ fromJSON(inputs.platform).buildenv_script }} setup
        env:
          BUILDENV_BASEPATH: ${{ fromJSON(inputs.platform).buildenv_basepath }}

      - name: "[macOS/Windows] Get build environment name"
        if: runner.os != 'Linux'
        run: ${{ fromJSON(inputs.platform).buildenv_script }} name

      - name: "[macOS/Windows] Restore buildenv archive cache"
        if: env.BUILDENV_NAME != null
        uses: actions/cache/restore@v6
        with:
          path: ${{ fromJSON(inputs.platform).buildenv_basepath }}/${{ env.BUILDENV_NAME }}.zip
          key: buildenv-${{ env.BUILDENV_NAME }}

      - name: "Download buildenv"
        # No need for all the option, we just need to download the buildenv here
        run: >-
          cmake ..
        working-directory: build
        env:
          CC: ${{ fromJSON(inputs.platform).cc }}
          CXX: ${{ fromJSON(inputs.platform).cxx }}

      - name: "[Linux] Install UI test dependencies"
        if: runner.os == 'Linux' && startsWith(matrix.target, 'e2e-')
        run: |
          sudo apt-get update && sudo apt-get install -y \
            xvfb ffmpeg \
            cage wf-recorder wlr-randr

      - name: "[Windows] Setup UI test dependencies"
        if: runner.os == 'Windows' && startsWith(matrix.target, 'e2e-')
        timeout-minutes: 5
        shell: pwsh
        working-directory: build
        run: |
          # Add OpenGL library for software rendering (no GPU in CI).
          # Official prebuilt from download.qt.io, pinned by SHA-256
          # (matches https://download.qt.io/development_releases/prebuilt/llvmpipe/windows/sha256sums.txt)
          $downloadUrl = "https://download.qt.io/development_releases/prebuilt/llvmpipe/windows/opengl32sw-64.7z"
          $localPath = "opengl32sw-64.7z"
          $expectedChecksum = "a19b32017652de3a6d33bc861186303a95b92ec570c36277e137093909d47ccd"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $localPath

          $actualChecksum = (Get-FileHash -Algorithm SHA256 -Path $localPath).Hash

          if ($actualChecksum -ne $expectedChecksum) {
              Write-Host "Checksum verification failed."
              exit 1
          }

          Set-PSRepository -Name 'PSGallery' -SourceLocation "https://www.powershellgallery.com/api/v2" -InstallationPolicy Trusted
          Install-Module -Name 7Zip4PowerShell -Force

          Expand-7Zip -ArchiveFileName $localPath -TargetPath '.'
          "QSG_RHI_BACKEND=opengl" >> $env:GITHUB_ENV

      - name: "[Windows] Set screen resolution for UI test"
        if: runner.os == 'Windows' && startsWith(matrix.target, 'e2e-')
        run: |
          Get-CimInstance CIM_VideoControllerResolution | Select-Object Caption, HorizontalResolution, VerticalResolution
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name DisplaySettings -Scope CurrentUser -Force -AllowClobber -Confirm:$false
          Import-Module -Name DisplaySettings -Force
          Set-DisplayResolution -Width 1920 -Height 1080

      - name: "Run unit tests"
        if: matrix.target == 'unit'
        run: ctest --timeout 45 --label-exclude 'e2e' ${{ fromJSON(inputs.platform).ctest_args }}
        working-directory: build
        env:
          GTEST_COLOR: 1
          CTEST_PARALLEL_LEVEL: ${{ runner.os == 'Windows' && '1' || (runner.os == 'macOS' && '3' || '4' ) }}
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: "[macOS] Find FFMPEG"
        if: runner.os == 'macOS' && fromJSON(inputs.platform).crosscompile != true && startsWith(matrix.target, 'e2e-')
        shell: bash
        run: |
          find "$BUILDENV_BASEPATH" -name ffmpeg
          # Using $(echo ) to trim spaces
          MIXXX_FFMPEG_BIN="${BUILDENV_BASEPATH}/$(echo $BUILDENV_NAME)/installed/$(echo $VCPKG_TARGET_TRIPLET)/tools/ffmpeg/ffmpeg"
          if [ ! -f "$MIXXX_FFMPEG_BIN" ]; then
            echo "Cannot find ffmpeg at: $MIXXX_FFMPEG_BIN"
            exit 1
          fi
          echo "MIXXX_FFMPEG_BIN=$MIXXX_FFMPEG_BIN" >> $GITHUB_ENV

      - name: "[Windows] Find FFMPEG"
        if: runner.os == 'Windows' && startsWith(matrix.target, 'e2e-')
        shell: bash
        run: |
          find "/c/buildenv/$(echo $BUILDENV_NAME)/installed/$(echo $VCPKG_TARGET_TRIPLET)/tools/" -name '*.exe'
          # Using $(echo ) to trim spaces
          MIXXX_FFMPEG_BIN="/c/buildenv/$(echo $BUILDENV_NAME)/installed/$(echo $VCPKG_TARGET_TRIPLET)/tools/ffmpeg/ffmpeg.exe"
          if [ ! -f "$MIXXX_FFMPEG_BIN" ]; then
            echo "Cannot find ffmpeg at: $MIXXX_FFMPEG_BIN"
            exit 1
          fi
          # Rewriting in Windows format
          MIXXX_FFMPEG_BIN="C:\\buildenv\\$(echo $BUILDENV_NAME)\\installed\\$(echo $VCPKG_TARGET_TRIPLET)\\tools\\ffmpeg\\ffmpeg.exe"
          echo "MIXXX_FFMPEG_BIN=$MIXXX_FFMPEG_BIN" >> $GITHUB_ENV

      - name: "[macOS/Windows] Test FFMPEG"
        if: env.MIXXX_FFMPEG_BIN != null && startsWith(matrix.target, 'e2e-')
        run: ${{ env.MIXXX_FFMPEG_BIN }} -formats

      - name: "Run E2E batch"
        if: startsWith(matrix.target, 'e2e-')
        id: e2e_test
        working-directory: build
        shell: bash
        # One runner invocation per feature file, sequential within the batch
        # (the CTest suite serialises on the RPC port anyway); the batch
        # membership is static (see the matrix above).
        run: |
          ctest -L 'e2e' -R "mixxx-behave-(${{ matrix.features }})\$" -V --timeout 3500
        timeout-minutes: 60
        env:
          QSG_INFO: "1"
          QT_LOGGING_RULES: "qt.scenegraph.general=true"
          TARGET: ${{ matrix.target }}
          MIXXX_TEST_HEADLESS: ${{ (runner.os == 'Linux' || fromJSON(inputs.platform).artifacts_slug == 'windows-winarm') && '1' || '' }}
          # In the future, we could run both xwayland and xfb
          MIXXX_TEST_DISPLAY_BACKEND: ${{ runner.os == 'Linux' && 'xwayland' || '' }}
          MIXXX_TEST_RECORD: ${{ fromJSON(inputs.platform).artifacts_slug != 'windows-winarm' && '1' || '' }}
          MIXXX_TEST_ARTIFACTS: ${{ github.workspace }}/src/test/behave/artifacts

      - name: "Install @actions/artifact for video upload"
        if: always() && steps.e2e_test.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        shell: bash
        id: npm
        run: |
          npm install @actions/artifact
          echo "root=`npm root`" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        if: always() && steps.e2e_test.outcome != 'skipped'
        with:
          name: mixxx-ui-test-${{ fromJSON(inputs.platform).artifacts_slug }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/src/test/behave/artifacts/*.json
            ${{ github.workspace }}/src/test/behave/artifacts/mixxx-output.*.log

      - name: "Upload unzipped videos"
        if: always() && steps.e2e_test.outcome != 'skipped'
        env:
          NPM_ROOT: ${{ steps.npm.outputs.root }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {DefaultArtifactClient} = require(`${process.env.NPM_ROOT}/@actions/artifact`);

            const client = new DefaultArtifactClient();
            const videosDir = path.resolve(process.env.GITHUB_WORKSPACE, 'src/test/behave/artifacts');
            const entries = fs.existsSync(videosDir) ? fs.readdirSync(videosDir)
              .filter(f => f.startsWith('mixxx-ui-test') && f.endsWith('.mkv'))
              .map(f => ({name: f, absPath: path.resolve(videosDir, f)})): [];

            if (entries.length === 0) {
              core.notice('no videos found, skipping');
              return;
            }

            // Parse label and timestamp from mixxx-ui-test-{label}-{timestamp}.mkv
            const FILE_RE = /^mixxx-ui-test-(.+)-(\d{8}-\d{6})\.mkv$/;
            const parsed = [];
            for (const entry of entries) {
              const m = entry.name.match(FILE_RE);
              if (m) {
                parsed.push({label: m[1], timestamp: m[2], ...entry});
              }
            }

            // Upload artifacts and collect URLs
            const urlsByName = {};
            for (const entry of parsed) {
              const {id} = await client.uploadArtifact(
                entry.name,
                [entry.absPath],
                videosDir,
                {skipArchive: true, retentionDays: 7}
              );
              urlsByName[entry.name] = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts/${id}`;
            }

            // Group by label (lowercase), sort by timestamp within each group
            const groups = {};
            for (const entry of parsed) {
              const key = entry.label.toLowerCase();
              if (!groups[key]) groups[key] = [];
              groups[key].push(entry);
            }
            for (const key of Object.keys(groups)) {
              groups[key].sort((a, b) => a.timestamp.localeCompare(b.timestamp));
            }

            // Build summary
            const summaryLines = [`# ${{ fromJSON(inputs.platform).name }} — ${{ matrix.target }}`];
            for (const [label, items] of Object.entries(groups)) {
              const multi = items.length > 1;
              summaryLines.push(`## ${label}`);
              for (let i = 0; i < items.length; i++) {
                const suffix = multi ? ` (attempt ${i + 1})` : '';
                summaryLines.push(`  - [${items[i].name}](${urlsByName[items[i].name]})${suffix}`);
              }
              summaryLines.push('');
            }

            await core.summary
              .addRaw(summaryLines.join('\n'), true)
              .write();

      - name: "Attach behave transcript to job summary"
        if: always() && steps.e2e_test.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          artifacts_dir="src/test/behave/artifacts"
          if ! compgen -G "$artifacts_dir/behave-output-*.txt" > /dev/null; then
            echo "No behave transcript found, skipping summary attachment."
            exit 0
          fi
          {
            echo "## Behave transcript (with video timecodes)"
            echo ""
            shopt -s nullglob
            for f in "$artifacts_dir"/behave-output-*.txt; do
              label=$(basename "$f" | sed -E 's/^behave-output-(.+)\.txt$/\1/')
              echo "<details>"
              echo "<summary><strong>${label}</strong></summary>"
              echo ""
              echo '```'
              cat "$f"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"
